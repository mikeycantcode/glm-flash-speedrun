<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLM Flash Speedrun</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="data.js"></script>
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4;
    --keep: #15803d; --revert: #a8a29e; --invalid: #dc2626; --best: #2563eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin-bottom: 20px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .kpi .value { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .delta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .latest { margin-bottom: 16px; border-left: 4px solid var(--keep); }
  .latest h2, .card h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .latest .msg { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .latest .stats { display: flex; flex-wrap: wrap; gap: 18px; font-variant-numeric: tabular-nums; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  .chart { position: relative; height: 280px; }
  .chart.tall { height: 320px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
  .KEEP { color: var(--keep); background: #dcfce7; } .REVERT { color: #57534e; background: #f5f5f4; }
  .INVALID { color: var(--invalid); background: #fee2e2; } .BASELINE { color: var(--best); background: #dbeafe; }
  .why { color: var(--muted); font-size: 12px; }
  a { color: var(--best); }
  .tablewrap { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <h1>GLM-5.3-Flash speedrun</h1>
  <div class="sub" id="sub"></div>
  <div class="kpis" id="kpis"></div>
  <div class="card latest" id="latest"></div>
  <div class="card"><h2>Score by experiment (baseline = 100)</h2><div class="chart tall"><canvas id="score"></canvas></div></div>
  <div class="grid2">
    <div class="card"><h2>Decode tok/s (higher is better)</h2><div class="chart"><canvas id="tps"></canvas></div></div>
    <div class="card"><h2>TTFT ms (lower is better)</h2><div class="chart"><canvas id="ttft"></canvas></div></div>
  </div>
  <div class="card" style="margin-top:12px"><h2>Recent experiments</h2><div class="tablewrap"><table id="table"></table></div></div>
</main>
<script>
const D = window.SPEEDRUN || { runs: [] };
const exps = D.runs.filter(r => r.kind === "experiment");
const base = D.baseline;
const fmt = (x, d = 1) => x == null ? "–" : x.toFixed(d);
const pct = (a, b) => (a / b - 1) * 100;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Best-so-far trajectory: starts at baseline, steps on every KEEP.
let best = base ? { score: 100, tps: base.tps, ttft_ms: base.ttft_ms, id: 0 } : null;
const trail = base ? [{ x: 0, ...best }] : [];
for (const r of exps) {
  if (r.decision === "KEEP") best = { score: r.score, tps: r.tps, ttft_ms: r.ttft_ms, id: r.id, row: r };
  if (best) trail.push({ x: r.id, ...best });
}
const lastKeep = [...exps].reverse().find(r => r.decision === "KEEP");

document.getElementById("sub").textContent =
  `1× B300 · nvidia/GLM-5.3-Flash-NVFP4 · batch 1, 2048-token prompt → 512 tokens · ` +
  `spent $${fmt(D.spent_usd, 2)} / $${fmt(D.budget_usd, 0)} · updated ${D.generated_at || "–"}`;

const kpi = (label, value, delta) => `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="delta">${delta}</div></div>`;
document.getElementById("kpis").innerHTML = !base ? kpi("Status", "No baseline", "run speedrun.py baseline") : [
  kpi("Best score", fmt(best.score, 1), `baseline 100 · keep needs +${fmt((D.keep_threshold || 0) * 100, 1)}%`),
  kpi("Decode tok/s", fmt(best.tps, 1), `${pct(best.tps, base.tps) >= 0 ? "+" : ""}${fmt(pct(best.tps, base.tps))}% vs ${fmt(base.tps)}`),
  kpi("TTFT", fmt(best.ttft_ms, 1) + " ms", `${fmt(pct(best.ttft_ms, base.ttft_ms))}% vs ${fmt(base.ttft_ms)} ms`),
  kpi("Experiments", exps.length, `${exps.filter(r => r.decision === "KEEP").length} kept · ${exps.filter(r => r.decision === "INVALID").length} invalid`),
].join("");

const L = document.getElementById("latest");
if (lastKeep) {
  L.innerHTML = `<h2>Most recent passed experiment · #${lastKeep.id}</h2>
    <div class="msg">${esc(lastKeep.message)}</div>
    <div class="stats"><span>score <b>${fmt(lastKeep.score, 2)}</b></span><span>tok/s <b>${fmt(lastKeep.tps)}</b></span>
    <span>TTFT <b>${fmt(lastKeep.ttft_ms)} ms</b></span><span>accuracy <b>${fmt(100 * lastKeep.accuracy, 1)}%</b></span>
    <span>${esc(lastKeep.ts || "")}</span>${D.repo && lastKeep.patch ? `<a href="${D.repo}/blob/main/${lastKeep.patch}">diff</a>` : ""}</div>`;
} else {
  L.innerHTML = `<h2>Most recent passed experiment</h2><div class="why">None yet.</div>`;
}

Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
Chart.defaults.color = "#78716c";
Chart.defaults.borderColor = "#e7e5e4";
const color = { KEEP: "#15803d", REVERT: "#a8a29e", INVALID: "#dc2626" };
const shape = { KEEP: "circle", REVERT: "circle", INVALID: "crossRot" };

function chart(id, key, label) {
  const pts = exps.filter(r => r[key] != null);
  const ds = ["KEEP", "REVERT"].map(dec => ({
    type: "scatter", label: dec === "KEEP" ? "kept" : "reverted",
    data: pts.filter(r => r.decision === dec).map(r => ({ x: r.id, y: r[key], r })),
    backgroundColor: dec === "KEEP" ? color.KEEP : "rgba(168,162,158,.25)", borderColor: color[dec],
    pointStyle: shape[dec], pointRadius: dec === "KEEP" ? 5 : 4, borderWidth: 1.5,
  }));
  ds.push({
    type: "line", label: "best so far", data: trail.map(t => ({ x: t.x, y: t[key] })),
    borderColor: "#2563eb", backgroundColor: "#2563eb", stepped: "before", pointRadius: 0, borderWidth: 2,
  });
  const inv = exps.filter(r => r.decision === "INVALID").map(r => r.id);
  new Chart(document.getElementById(id), {
    data: { datasets: ds },
    options: {
      maintainAspectRatio: false, animation: false,
      scales: { x: { type: "linear", title: { display: true, text: "experiment #" }, min: 0, ticks: { precision: 0 } },
                y: { title: { display: true, text: label } } },
      plugins: {
        legend: { position: "bottom", labels: { usePointStyle: true, boxWidth: 8 } },
        tooltip: { callbacks: { label: c => c.raw.r ? `#${c.raw.r.id} ${c.raw.r.decision} ${fmt(c.parsed.y, 2)} — ${c.raw.r.message}` : `best ${fmt(c.parsed.y, 2)}` } },
        subtitle: { display: inv.length > 0, text: `invalid runs (not plotted): #${inv.join(", #")}`, color: "#dc2626", position: "bottom" },
      },
    },
  });
}
chart("score", "score", "score");
chart("tps", "tps", "tok/s");
chart("ttft", "ttft_ms", "ms");

const rows = [...exps].reverse().slice(0, 20);
document.getElementById("table").innerHTML =
  `<tr><th>#</th><th>result</th><th>change</th><th class="num">score</th><th class="num">tok/s</th><th class="num">TTFT ms</th><th class="num">acc</th><th class="num">cost</th></tr>` +
  rows.map(r => `<tr><td>${r.id}</td><td><span class="tag ${r.decision}">${r.decision}</span></td>
    <td>${esc(r.message)}<div class="why">${esc((r.reasons || []).join("; "))}</div></td>
    <td class="num">${fmt(r.score, 2)}</td><td class="num">${fmt(r.tps)}</td><td class="num">${fmt(r.ttft_ms)}</td>
    <td class="num">${r.accuracy == null ? "–" : fmt(100 * r.accuracy, 0) + "%"}</td><td class="num">$${fmt(r.cost_usd, 2)}</td></tr>`).join("");
</script>
</body>
</html>
